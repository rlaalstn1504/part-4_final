<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose와 Kubernetes 비교 도식</title>
  <desc id="desc">Docker Compose는 한 대의 서버에서 여러 컨테이너를 실행하고, Kubernetes는 여러 서버로 구성된 클러스터에서 Pod를 자동 배치, 확장, 복구한다.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .label { font-family: "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 21px; font-weight: 700; }
      .chip { font-size: 14px; font-weight: 700; }
      .code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" class="label title">컨테이너 운영 범위의 차이</text>

  <rect x="24" y="64" width="424" height="424" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="512" y="64" width="424" height="424" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="236" y="101" text-anchor="middle" class="label section">Docker Compose</text>
  <text x="236" y="126" text-anchor="middle" class="label body muted">한 대의 서버에서 컨테이너 묶음 실행</text>

  <rect x="78" y="158" width="316" height="242" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="236" y="188" text-anchor="middle" class="label body" font-weight="700">서버 1대</text>

  <rect x="106" y="226" width="108" height="72" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="253" text-anchor="middle" class="label code">compose</text>
  <text x="160" y="277" text-anchor="middle" class="label small muted">YAML 설정</text>

  <rect x="270" y="210" width="86" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="313" y="236" text-anchor="middle" class="label chip">web</text>
  <rect x="270" y="270" width="86" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="313" y="296" text-anchor="middle" class="label chip">api</text>
  <rect x="270" y="330" width="86" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="313" y="356" text-anchor="middle" class="label chip">db</text>

  <path d="M 216 251 C 238 242, 245 234, 265 231" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 216 262 H 264" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 216 273 C 238 288, 246 340, 265 350" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="78" y="424" width="316" height="38" rx="19" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="236" y="448" text-anchor="middle" class="label small">서버가 멈추면 전체 앱도 영향을 받음</text>

  <text x="724" y="101" text-anchor="middle" class="label section">Kubernetes</text>
  <text x="724" y="126" text-anchor="middle" class="label body muted">여러 서버를 하나의 클러스터처럼 관리</text>

  <rect x="626" y="148" width="196" height="58" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="724" y="173" text-anchor="middle" class="label body" font-weight="700">Control Plane</text>
  <text x="724" y="193" text-anchor="middle" class="label small muted">배치 · 확장 · 복구 결정</text>

  <path d="M 724 207 V 234" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="745" y="226" class="label small muted">자동 제어</text>

  <rect x="548" y="242" width="352" height="168" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="724" y="268" text-anchor="middle" class="label body" font-weight="700">Cluster</text>

  <rect x="570" y="286" width="96" height="96" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="618" y="309" text-anchor="middle" class="label small" font-weight="700">Node A</text>
  <rect x="584" y="324" width="68" height="32" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="618" y="345" text-anchor="middle" class="label chip">Pod</text>

  <rect x="676" y="286" width="96" height="96" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="724" y="309" text-anchor="middle" class="label small" font-weight="700">Node B</text>
  <rect x="690" y="324" width="68" height="32" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="724" y="345" text-anchor="middle" class="label chip">Pod</text>

  <rect x="782" y="286" width="96" height="96" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="830" y="309" text-anchor="middle" class="label small" font-weight="700">Node C</text>
  <rect x="796" y="324" width="68" height="32" rx="7" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
  <text x="830" y="345" text-anchor="middle" class="label chip">Pod</text>

  <rect x="626" y="424" width="196" height="38" rx="19" fill="#fefce8" stroke="#fde68a"/>
  <text x="724" y="448" text-anchor="middle" class="label small">요청 분산 · 자동 확장 · 자기 치유</text>

  <path d="M 555 177 H 616" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="543" y="181" text-anchor="end" class="label small muted">사용자 요청</text>

  <path d="M 724 207 C 670 232, 618 258, 618 319" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 724 207 V 319" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 724 207 C 778 232, 830 258, 830 319" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="724" y="402" text-anchor="middle" class="label small muted">Pod는 Kubernetes에서 컨테이너를 실행하는 기본 단위</text>
</svg>

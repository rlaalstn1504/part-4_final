<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">API와 REST API의 관계</title>
  <desc id="desc">API는 프로그램끼리 기능을 주고받는 약속 전체를 뜻하는 큰 개념이고, REST API는 그 안에서 HTTP의 URL과 Method로 통신하는 한 종류이다. 같은 API 안에 라이브러리 API, GraphQL, gRPC 등 다른 종류도 있다.</desc>
  <defs>
    <style>
      .label { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .code { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; fill: #1d4ed8; }
    </style>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="480" y="40" text-anchor="middle" class="label title">API ⊃ REST API</text>
  <text x="480" y="68" text-anchor="middle" class="label body muted">API가 더 큰 개념이고, REST API는 그 안의 한 종류이다</text>

  <!-- API (바깥 큰 상자) -->
  <rect x="30" y="92" width="900" height="350" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="60" y="128" class="label section">API (Application Programming Interface)</text>
  <text x="60" y="154" class="label body muted">프로그램끼리 기능·데이터를 주고받기 위한 약속(규칙) 전체</text>

  <!-- REST API (강조) -->
  <rect x="60" y="180" width="300" height="236" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="210" y="214" text-anchor="middle" class="label section" fill="#1d4ed8">REST API</text>
  <text x="210" y="244" text-anchor="middle" class="label body">HTTP 위에서</text>
  <text x="210" y="266" text-anchor="middle" class="label body">URL(자원) + Method(행동)로 통신</text>
  <rect x="88" y="290" width="244" height="104" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="110" y="318" class="code">GET  /users/1</text>
  <text x="110" y="344" class="code">POST /predict</text>
  <text x="210" y="376" text-anchor="middle" class="label small muted">← 이 강의에서 FastAPI로 만드는 것</text>

  <!-- 다른 종류의 API -->
  <rect x="390" y="180" width="160" height="236" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="470" y="214" text-anchor="middle" class="label section">라이브러리 API</text>
  <text x="470" y="250" text-anchor="middle" class="label small muted">코드 안에서</text>
  <text x="470" y="272" text-anchor="middle" class="label small muted">함수를 직접 호출</text>
  <text x="470" y="320" text-anchor="middle" class="code" fill="#0f172a">pd.read_csv()</text>

  <rect x="570" y="180" width="160" height="236" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="214" text-anchor="middle" class="label section">GraphQL</text>
  <text x="650" y="250" text-anchor="middle" class="label small muted">하나의 주소로</text>
  <text x="650" y="272" text-anchor="middle" class="label small muted">필요한 데이터만 질의</text>

  <rect x="750" y="180" width="160" height="236" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="830" y="214" text-anchor="middle" class="label section">gRPC</text>
  <text x="830" y="250" text-anchor="middle" class="label small muted">서버 간 빠른</text>
  <text x="830" y="272" text-anchor="middle" class="label small muted">함수 호출 방식</text>
</svg>

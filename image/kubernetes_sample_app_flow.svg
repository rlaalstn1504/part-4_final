<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 실습 앱 구조</title>
  <desc id="desc">브라우저 요청이 web-frontend, time-api, logger-api로 이어지고 각 애플리케이션은 Service와 Pod로 배포되는 구조를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="label title">실습 앱의 Kubernetes 구조</text>
  <text x="480" y="66" text-anchor="middle" class="label body muted">각 앱은 Pod로 실행되고, Service 이름으로 서로 통신한다</text>
  <rect x="42" y="216" width="130" height="76" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="107" y="247" text-anchor="middle" class="label section">브라우저</text>
  <text x="107" y="273" text-anchor="middle" class="label small muted">사용자 요청</text>
  <path d="M 174 254 H 222" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="198" y="237" text-anchor="middle" class="label small muted">접속</text>
  <rect x="230" y="116" width="204" height="276" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="332" y="146" text-anchor="middle" class="label section">web-frontend</text>
  <rect x="264" y="174" width="136" height="58" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="332" y="198" text-anchor="middle" class="label body" font-weight="700">Service</text>
  <text x="332" y="218" text-anchor="middle" class="label code">web-frontend</text>
  <path d="M 332 236 V 278" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="264" y="284" width="136" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="332" y="312" text-anchor="middle" class="label body" font-weight="700">Pod</text>
  <text x="332" y="335" text-anchor="middle" class="label small muted">Nginx 웹</text>
  <path d="M 436 317 H 488" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="462" y="299" text-anchor="middle" class="label code muted">/api/time</text>
  <rect x="496" y="116" width="204" height="276" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="598" y="146" text-anchor="middle" class="label section">time-api</text>
  <rect x="530" y="174" width="136" height="58" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="598" y="198" text-anchor="middle" class="label body" font-weight="700">Service</text>
  <text x="598" y="218" text-anchor="middle" class="label code">time-api</text>
  <path d="M 598 236 V 278" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="530" y="284" width="136" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="598" y="312" text-anchor="middle" class="label body" font-weight="700">Pod</text>
  <text x="598" y="335" text-anchor="middle" class="label small muted">현재 시간 반환</text>
  <path d="M 700 317 H 752" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="726" y="299" text-anchor="middle" class="label code muted">/log</text>
  <rect x="760" y="116" width="158" height="276" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="839" y="146" text-anchor="middle" class="label section">logger-api</text>
  <rect x="782" y="174" width="114" height="58" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="839" y="198" text-anchor="middle" class="label body" font-weight="700">Service</text>
  <text x="839" y="218" text-anchor="middle" class="label code">logger-api</text>
  <path d="M 839 236 V 278" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="782" y="284" width="114" height="66" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="839" y="312" text-anchor="middle" class="label body" font-weight="700">Pod</text>
  <text x="839" y="335" text-anchor="middle" class="label small muted">로그 출력</text>
  <rect x="196" y="430" width="252" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="322" y="452" text-anchor="middle" class="label body" font-weight="700">Deployment</text>
  <text x="322" y="474" text-anchor="middle" class="label small muted">Pod를 만들고 계속 유지</text>
  <rect x="512" y="430" width="252" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="638" y="452" text-anchor="middle" class="label body" font-weight="700">Service</text>
  <text x="638" y="474" text-anchor="middle" class="label small muted">고정 이름과 접속 통로 제공</text>
</svg>

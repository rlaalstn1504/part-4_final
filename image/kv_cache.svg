  <rect x="20" y="376" width="920" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="406" class="label section">② KV 캐시 사용</text>
  <text x="44" y="428" class="label muted small">새로 생긴 토큰의 K/V만 계산하고, 과거 K/V는 저장해 둔 값을 꺼내 씁니다.</text>

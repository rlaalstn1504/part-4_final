  <text x="470" y="631" text-anchor="middle" class="label chip" style="fill:#334155">계산 1회</text>
  <text x="650" y="456" text-anchor="middle" class="label body" style="font-weight:700">스텝 3</text>
  <rect x="570" y="468" width="160" height="30" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="488" text-anchor="middle" class="label cell" style="fill:#1e40af">나는  K·V</text>
  <rect x="570" y="504" width="160" height="30" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="524" text-anchor="middle" class="label cell" style="fill:#1e40af">밥을  K·V</text>
  <rect x="570" y="540" width="160" height="30" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="650" y="560" text-anchor="middle" class="label cell" style="fill:#9a3412">먹었  K·V</text>

  <text x="830" y="234" text-anchor="middle" class="label cell" style="fill:#9a3412">밥을  K·V</text>
  <rect x="750" y="250" width="160" height="30" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>

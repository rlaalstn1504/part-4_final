<svg xmlns="http://www.w3.org/2000/svg" width="960" height="742" viewBox="0 0 960 742" role="img" aria-labelledby="title desc">
  <title id="title">KV 캐시 동작 원리</title>
  <desc id="desc">캐시가 없을 때는 매 스텝마다 과거 토큰의 K/V를 전부 다시 계산하지만, KV 캐시를 쓰면 새 토큰의 K/V만 계산하고 과거 K/V는 저장된 값을 재사용한다.</desc>
  <defs><style>
    .label { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #0f172a; }
    .muted { fill: #475569; }
    .title { font-size: 27px; font-weight: 700; }
    .section { font-size: 19px; font-weight: 700; }
    .body { font-size: 15px; }
    .small { font-size: 13px; }
    .cell { font-size: 14px; font-weight: 600; }
    .chip { font-size: 13px; font-weight: 700; }
  </style></defs>
  <rect width="960" height="742" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="label title">KV 캐시 : 과거 K/V를 왜 저장할까?</text>
  <rect x="286" y="58" width="16" height="16" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="310" y="71" class="label small">GPU가 계산함</text>
  <rect x="430" y="58" width="16" height="16" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="454" y="71" class="label small">캐시에서 꺼내 씀 (계산 없음)</text>
  <rect x="20" y="86" width="920" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="116" class="label section">① KV 캐시 없음</text>
  <text x="44" y="138" class="label muted small">매 스텝마다 과거 토큰의 K/V까지 전부 다시 계산합니다.</text>

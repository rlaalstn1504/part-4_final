  <text x="650" y="631" text-anchor="middle" class="label chip" style="fill:#334155">계산 1회</text>
  <text x="830" y="456" text-anchor="middle" class="label body" style="font-weight:700">스텝 4</text>
  <rect x="750" y="468" width="160" height="30" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="830" y="488" text-anchor="middle" class="label cell" style="fill:#1e40af">나는  K·V</text>
  <rect x="750" y="504" width="160" height="30" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="830" y="524" text-anchor="middle" class="label cell" style="fill:#1e40af">밥을  K·V</text>
  <rect x="750" y="540" width="160" height="30" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="830" y="560" text-anchor="middle" class="label cell" style="fill:#1e40af">먹었  K·V</text>
  <rect x="750" y="576" width="160" height="30" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="830" y="596" text-anchor="middle" class="label cell" style="fill:#9a3412">다  K·V</text>
  <rect x="780" y="616" width="100" height="22" rx="11" fill="#e2e8f0"/>
  <text x="830" y="631" text-anchor="middle" class="label chip" style="fill:#334155">계산 1회</text>
  <rect x="20" y="666" width="920" height="60" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="44" y="692" class="label body"><tspan style="font-weight:700">토큰 4개를 만들 때 K/V 계산 횟수 : 10회 → 4회</tspan>  — 문장이 길어질수록 격차는 더 벌어집니다.</text>
  <text x="44" y="713" class="label muted small">Q(Query)는 매 스텝 새로 계산합니다. 저장해 두고 재사용하는 것은 과거 토큰의 K와 V입니다.</text>

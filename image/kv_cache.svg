  <text x="290" y="198" text-anchor="middle" class="label cell" style="fill:#9a3412">나는  K·V</text>
  <rect x="240" y="326" width="100" height="22" rx="11" fill="#e2e8f0"/>
  <text x="290" y="341" text-anchor="middle" class="label chip" style="fill:#334155">계산 1회</text>
  <text x="470" y="166" text-anchor="middle" class="label body" style="font-weight:700">스텝 2</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">클라이언트–서버 구조와 REST API</title>
  <desc id="desc">클라이언트가 GET /users/1 요청을 보내면 서버가 자원을 처리해 200 OK와 JSON으로 응답한다. REST 요청은 Method(행동)와 URL(자원)로 읽으며, 같은 URL이라도 Method에 따라 조회, 생성, 수정, 삭제가 달라진다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .label { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .bold { font-weight: 700; }
      .small { font-size: 14px; }
      .code { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; fill: #0f172a; }
      .method { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", monospace; font-weight: 700; fill: #c2410c; }
      .url { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", monospace; font-weight: 700; fill: #1d4ed8; }
    </style>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="480" y="40" text-anchor="middle" class="label title">클라이언트–서버 구조와 REST API</text>
  <text x="480" y="68" text-anchor="middle" class="label body muted">클라이언트가 요청을 보내면, 서버가 처리해서 응답을 돌려준다</text>

  <!-- 클라이언트 -->
  <rect x="30" y="96" width="180" height="190" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="120" y="128" text-anchor="middle" class="label section">클라이언트</text>
  <rect x="52" y="144" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="168" text-anchor="middle" class="label small">웹 브라우저</text>
  <rect x="52" y="190" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="214" text-anchor="middle" class="label small">모바일 앱</text>
  <rect x="52" y="236" width="136" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="260" text-anchor="middle" class="label small">다른 서버</text>

  <!-- 요청 -->
  <text x="449" y="128" text-anchor="middle" class="label body bold">요청 (Request)</text>
  <path d="M 212 156 H 682" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="379" y="140" width="140" height="32" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="449" y="161" text-anchor="middle" class="code">GET /users/1</text>

  <!-- 응답 -->
  <text x="449" y="226" text-anchor="middle" class="label body bold">응답 (Response)</text>
  <path d="M 688 254 H 218" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="339" y="238" width="220" height="32" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="449" y="259" text-anchor="middle" class="code">200 OK {"name": "minsu"}</text>

  <!-- 서버 -->
  <rect x="690" y="96" width="240" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="810" y="128" text-anchor="middle" class="label section">서버</text>
  <text x="810" y="150" text-anchor="middle" class="label small muted">자원(Resource)을 관리</text>
  <rect x="708" y="164" width="204" height="32" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="722" y="185" class="label small">사용자</text>
  <text x="898" y="185" text-anchor="end" class="code">/users</text>
  <rect x="708" y="204" width="204" height="32" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="722" y="225" class="label small">상품</text>
  <text x="898" y="225" text-anchor="end" class="code">/items</text>
  <rect x="708" y="244" width="204" height="32" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="722" y="265" class="label small">예측 모델</text>
  <text x="898" y="265" text-anchor="end" class="code">/predict</text>

  <!-- REST 요청 읽는 법 -->
  <rect x="24" y="306" width="912" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="44" y="338" class="label body bold">REST API 요청 한 줄 읽는 법</text>

  <text x="70" y="398" class="method" font-size="30">GET</text>
  <text x="150" y="398" class="url" font-size="30">/users/1</text>
  <path d="M 70 412 V 418 H 124 V 412" fill="none" stroke="#c2410c" stroke-width="2"/>
  <path d="M 150 412 V 418 H 294 V 412" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="97" y="444" text-anchor="middle" class="label small bold" style="fill:#c2410c">Method = 행동</text>
  <text x="97" y="466" text-anchor="middle" class="label small muted">무엇을 할지</text>
  <text x="222" y="444" text-anchor="middle" class="label small bold" style="fill:#1d4ed8">URL = 자원</text>
  <text x="222" y="466" text-anchor="middle" class="label small muted">무엇에 대해</text>

  <path d="M 350 326 V 480" stroke="#cbd5e1" stroke-width="2"/>

  <text x="380" y="346" class="label small bold muted">같은 자원이라도 Method에 따라 행동이 달라진다</text>
  <text x="380" y="380" class="method" font-size="15">GET</text>
  <text x="450" y="380" class="url" font-size="15">/users</text>
  <text x="560" y="380" class="label body muted">→</text>
  <text x="590" y="380" class="label body">사용자 목록 조회</text>
  <text x="380" y="408" class="method" font-size="15">POST</text>
  <text x="450" y="408" class="url" font-size="15">/users</text>
  <text x="560" y="408" class="label body muted">→</text>
  <text x="590" y="408" class="label body">새 사용자 생성</text>
  <text x="380" y="436" class="method" font-size="15">PUT</text>
  <text x="450" y="436" class="url" font-size="15">/users/1</text>
  <text x="560" y="436" class="label body muted">→</text>
  <text x="590" y="436" class="label body">1번 사용자 정보 수정</text>
  <text x="380" y="464" class="method" font-size="15">DELETE</text>
  <text x="450" y="464" class="url" font-size="15">/users/1</text>
  <text x="560" y="464" class="label body muted">→</text>
  <text x="590" y="464" class="label body">1번 사용자 삭제</text>
</svg>

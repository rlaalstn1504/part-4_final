<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 장점 흐름 도식</title>
  <desc id="desc">Kubernetes가 원하는 상태 선언, 현재 상태 감시, 자동 조정, 안정적인 서비스 운영으로 이어지는 흐름을 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .chip { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="label title">Kubernetes의 장점은 어디서 나오나</text>
  <text x="480" y="66" text-anchor="middle" class="label body muted">원하는 상태와 현재 상태의 차이를 계속 줄이는 방식으로 운영한다</text>

  <rect x="48" y="138" width="190" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="143" y="174" text-anchor="middle" class="label section">원하는 상태 선언</text>
  <text x="143" y="204" text-anchor="middle" class="label body">Deployment</text>
  <text x="143" y="229" text-anchor="middle" class="label body muted">Service YAML</text>

  <path d="M 242 198 H 298" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="304" y="138" width="190" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="399" y="174" text-anchor="middle" class="label section">현재 상태 감시</text>
  <text x="399" y="204" text-anchor="middle" class="label body">Pod·Node 상태</text>
  <text x="399" y="229" text-anchor="middle" class="label body muted">부하와 장애 확인</text>

  <path d="M 498 198 H 554" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="560" y="138" width="190" height="120" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="655" y="174" text-anchor="middle" class="label section">차이 자동 조정</text>
  <text x="655" y="204" text-anchor="middle" class="label body">복구·확장·배포</text>
  <text x="655" y="229" text-anchor="middle" class="label body muted">필요 작업 실행</text>

  <path d="M 754 198 H 810" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="816" y="138" width="96" height="120" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="864" y="175" text-anchor="middle" class="label section">서비스</text>
  <text x="864" y="204" text-anchor="middle" class="label body">안정</text>
  <text x="864" y="229" text-anchor="middle" class="label body muted">운영</text>

  <rect x="74" y="326" width="176" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="162" y="351" text-anchor="middle" class="label chip">자동화된 관리</text>
  <text x="162" y="374" text-anchor="middle" class="label small muted">반복 작업 감소</text>

  <rect x="282" y="326" width="176" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="370" y="351" text-anchor="middle" class="label chip">높은 확장성</text>
  <text x="370" y="374" text-anchor="middle" class="label small muted">부하에 맞춰 조정</text>

  <rect x="502" y="326" width="176" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="590" y="351" text-anchor="middle" class="label chip">고가용성</text>
  <text x="590" y="374" text-anchor="middle" class="label small muted">장애 시 빠른 복구</text>

  <rect x="710" y="326" width="176" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="798" y="351" text-anchor="middle" class="label chip">자원 최적화</text>
  <text x="798" y="374" text-anchor="middle" class="label small muted">남는 자원 줄이기</text>

  <path d="M 162 326 C 198 294, 258 256, 340 223" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M 370 326 C 410 292, 514 260, 610 227" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M 590 326 C 592 292, 590 260, 594 227" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M 798 326 C 754 292, 710 260, 672 227" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI의 역할</title>
  <desc id="desc">클라이언트가 HTTP 요청을 보내면 FastAPI가 주소 확인, 입력 검사, 함수 실행, JSON 응답 순서로 처리한다. 실행하는 함수는 간단한 계산, DB 조회, AI 모델 추론 등 무엇이든 될 수 있고, 모델 서빙은 함수 안에 모델 추론을 넣은 경우이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .label { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .bold { font-weight: 700; }
      .small { font-size: 14px; }
      .green { fill: #15803d; }
      .code { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; fill: #0f172a; }
    </style>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="480" y="40" text-anchor="middle" class="label title">FastAPI는 Python 함수를 웹 API로 열어주는 도구</text>
  <text x="480" y="68" text-anchor="middle" class="label body muted">요청을 받아 → 검사하고 → 함수를 실행해 → JSON으로 돌려준다</text>

  <!-- 클라이언트 -->
  <rect x="30" y="120" width="140" height="320" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="158" text-anchor="middle" class="label section">클라이언트</text>
  <rect x="46" y="186" width="108" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="212" text-anchor="middle" class="label small">웹 브라우저</text>
  <rect x="46" y="240" width="108" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="266" text-anchor="middle" class="label small">모바일 앱</text>
  <rect x="46" y="294" width="108" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="320" text-anchor="middle" class="label small">다른 서버</text>
  <text x="100" y="384" text-anchor="middle" class="label small muted">누구나</text>
  <text x="100" y="404" text-anchor="middle" class="label small muted">URL로 요청</text>

  <!-- 요청 / 응답 -->
  <text x="250" y="164" text-anchor="middle" class="label small bold">HTTP 요청</text>
  <path d="M 172 176 H 340" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="250" y="198" text-anchor="middle" class="label small muted">URL · 데이터</text>

  <text x="250" y="392" text-anchor="middle" class="label small bold">HTTP 응답</text>
  <path d="M 346 404 H 178" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="250" y="426" text-anchor="middle" class="label small muted">JSON</text>

  <!-- FastAPI 서버 -->
  <rect x="348" y="96" width="290" height="358" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="493" y="128" text-anchor="middle" class="label section">FastAPI 서버</text>

  <rect x="366" y="146" width="254" height="60" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="382" y="170" class="label body bold">① 주소 확인</text>
  <text x="382" y="194" class="label small muted">URL·Method에 맞는 함수 찾기</text>

  <rect x="366" y="222" width="254" height="60" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="382" y="246" class="label body bold">② 입력 검사</text>
  <text x="382" y="270" class="label small muted">형식이 틀리면 422로 거절</text>

  <rect x="366" y="298" width="254" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="382" y="322" class="label body bold">③ 함수 실행</text>
  <text x="382" y="346" class="label small muted">개발자가 작성한 Python 함수</text>

  <rect x="366" y="374" width="254" height="60" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="382" y="398" class="label body bold">④ JSON으로 응답</text>
  <text x="382" y="422" class="label small muted">dict → JSON 자동 변환</text>

  <!-- ③에서 실행하는 함수 예시 -->
  <text x="815" y="128" text-anchor="middle" class="label body bold">③ 함수 안에는 무엇이든</text>
  <path d="M 622 328 C 664 328 664 186 702 186" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 622 328 C 664 328 664 266 702 266" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 622 328 C 664 328 664 362 702 362" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow-green)"/>

  <rect x="708" y="154" width="222" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="724" y="180" class="label body bold">간단한 계산</text>
  <text x="724" y="204" class="code">POST /bmi</text>

  <rect x="708" y="234" width="222" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="724" y="260" class="label body bold">DB 조회</text>
  <text x="724" y="284" class="code">GET /users/1</text>

  <rect x="708" y="314" width="222" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
  <text x="724" y="340" class="label body bold">AI 모델 추론</text>
  <text x="724" y="364" class="code">POST /predict</text>
  <text x="724" y="394" class="label small green bold">이번 강의의 목표</text>

  <text x="819" y="440" text-anchor="middle" class="label small muted">모델 서빙 = ③에 모델 추론을</text>
  <text x="819" y="460" text-anchor="middle" class="label small muted">넣은 API를 만드는 것</text>
</svg>
